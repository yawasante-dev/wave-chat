{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveChat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e1e1e;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rooms-label {
            padding: 12px 16px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rooms-label span {
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .rooms-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
        }

        .room-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .room-item:hover { background: #1a1a1a; }
        .room-item.active { background: #6c63ff22; }

        .room-hash {
            color: #555;
            font-size: 16px;
            flex-shrink: 0;
        }

        .room-item.active .room-hash { color: #6c63ff; }

        .room-name {
            color: #888;
            font-size: 14px;
            flex: 1;
        }

        .room-item.active .room-name { color: #fff; font-weight: 500; }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid #1e1e1e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }

        .user-info { flex: 1; overflow: hidden; }

        .user-name {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-text {
            color: #555;
            font-size: 11px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.15s;
        }

        .logout-btn:hover { color: #e74c3c; }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* AUTH PAGES */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }

        .auth-box {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .auth-subtitle {
            color: #666;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group { margin-bottom: 1rem; }

        label {
            display: block;
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #6c63ff;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn:hover { background: #574fd6; }

        .auth-link {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .auth-link a { color: #6c63ff; text-decoration: none; }

        .errorlist {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            list-style: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
